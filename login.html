<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Personal Hub</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <a class="brand" href="./">Personal<span>Hub</span></a>
      <p>登录后可写作、管理文件与文章</p>
    </div>
    <div class="card">
      <!-- 登录表单（默认显示） -->
      <form id="loginForm">
        <div class="form-item">
          <label for="username">用户名</label>
          <input type="text" id="username" autocomplete="username" />
        </div>
        <div class="form-item">
          <label for="password">密码</label>
          <input type="password" id="password" autocomplete="current-password" />
        </div>
        <div id="msg" class="err" style="min-height:18px;margin-bottom:8px;"></div>
        <button class="btn" id="loginBtn" type="submit">登 录</button>
        <button class="btn btn-ghost btn-block" id="showRegister" type="button">注册新账号</button>
      </form>

      <!-- 注册表单（点击"注册新账号"后显示） -->
      <form id="registerForm" class="hidden">
        <div class="form-item">
          <label for="regUsername">用户名（2-32 位字母/数字/下划线/连字符）</label>
          <input type="text" id="regUsername" autocomplete="username" />
        </div>
        <div class="form-item">
          <label for="regDisplay">昵称（可选）</label>
          <input type="text" id="regDisplay" maxlength="32" />
        </div>
        <div class="form-item">
          <label for="regPassword">密码（至少 8 位）</label>
          <input type="password" id="regPassword" autocomplete="new-password" />
        </div>
        <div class="form-item">
          <label for="regPassword2">确认密码</label>
          <input type="password" id="regPassword2" autocomplete="new-password" />
        </div>
        <div id="regMsg" class="err" style="min-height:18px;margin-bottom:8px;"></div>
        <button class="btn" id="regBtn" type="submit">注 册</button>
        <button class="btn btn-ghost btn-block" id="showLogin" type="button">返回登录</button>
        <p class="muted" style="margin:10px 0 0;font-size:12px;">注册后即可撰写文章，账号由管理员管理。</p>
      </form>

      <div class="login-foot"><a href="./">← 返回首页</a></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/assets/api.js"></script>
  <script>
    (function () {
      'use strict';
      var api = HUB.api, qs = HUB.qs;
      var next = qs('next') || './';
      // 防开放重定向：仅允许本站相对路径或同源绝对地址
      if (next.indexOf('://') !== -1 && next.indexOf(location.origin + '/') !== 0) next = './';

      // 表单切换：登录 ⇄ 注册
      document.getElementById('showRegister').addEventListener('click', function () {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
      });
      document.getElementById('showLogin').addEventListener('click', function () {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
      });

      // ---- 登录 ----
      document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        if (!username || !password) { msg.textContent = '请输入用户名与密码'; return; }
        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中…';
        msg.textContent = '';
        try {
          await api('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
          });
          location.href = next;
        } catch (err) {
          msg.textContent = err.message === 'USER_DISABLED' ? '账号已被停用，请联系管理员'
            : (err.message === 'TOO_MANY_REQUESTS' ? '尝试过于频繁，请稍后再试' : '登录失败：' + err.message);
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      });

      // ---- 注册 ----
      document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var username = document.getElementById('regUsername').value.trim();
        var display_name = document.getElementById('regDisplay').value.trim();
        var password = document.getElementById('regPassword').value;
        var password2 = document.getElementById('regPassword2').value;
        var msg = document.getElementById('regMsg');
        if (!/^[a-zA-Z0-9_-]{2,32}$/.test(username)) { msg.textContent = '用户名须为 2-32 位字母、数字、下划线或连字符'; return; }
        if (password.length < 8) { msg.textContent = '密码至少 8 位'; return; }
        if (password !== password2) { msg.textContent = '两次输入的密码不一致'; return; }
        var btn = document.getElementById('regBtn');
        btn.disabled = true;
        btn.textContent = '注册中…';
        msg.textContent = '';
        try {
          await api('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, display_name: display_name, password: password })
          });
          location.href = next; // 注册成功即登录
        } catch (err) {
          var m = err.message;
          if (m === 'USERNAME_EXISTS') m = '用户名已被占用';
          else if (m === 'REGISTER_DISABLED') m = '本站暂未开放注册';
          else if (m === 'TOO_MANY_REQUESTS') m = '尝试过于频繁，请稍后再试';
          else if (m === 'IP_ACCOUNT_LIMIT') m = '该网络环境下注册账号数已达上限，请联系管理员';
          else m = '注册失败：' + m;
          msg.textContent = m;
          btn.disabled = false;
          btn.textContent = '注 册';
        }
      });
    })();
  </script>
</body>
</html>
