# Personal Hub - Docker Compose 部署
# 用法：
#   1. 在项目根目录准备 .env（参考 .env.example，注意 DB_HOST 填 db）
#   2. docker compose up -d --build
#   3. 查看日志：docker compose logs -f app
#
# app 只在宿主机 127.0.0.1:3000 暴露，对外统一走 Nginx/Caddy 反代。

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-personal_hub}
      MARIADB_USER: ${DB_USER:-personal_hub}
      MARIADB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      # 固定时区：容器默认 UTC 会让 CURRENT_TIMESTAMP / NOW() / CURDATE() 比北京时间慢 8 小时。
      # 表里的时间列全是 DATETIME（非 TIMESTAMP），DATETIME 原样存墙上时间、不做时区转换，
      # 所以这一项决定的是「默认值写什么口径」，而不是「读出时怎么换算」：
      #   · 与下方 app 服务同设 CST，是为了让「DB 默认值写的」与「app 用 dbDateTimeInTz 写的」
      #     落到同一口径上 —— 此前两者混用，posts.created_at 一列里存在相差 8 小时的两种值。
      #   · 存量数据不会因此被追溯修正（DATETIME 无隐式转换），须一次性迁移，
      #     见 scripts/migrate-tz-cst.sql。
      # mariadb:11 镜像自带 tzdata（/usr/share/zoneinfo 存在），无需额外安装。
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
    # 不映射端口到宿主机，仅限 compose 网络内访问
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0，宿主机侧只暴露 127.0.0.1
      HOST: 0.0.0.0
      # 容器内通过服务名连数据库
      DB_HOST: db
      DB_PORT: 3306
      # 固定时区：默认 UTC 会让「每日 08:30 抓取」偏移 8 小时，日志时间也会与本地不符
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
