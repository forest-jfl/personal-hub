<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - Personal Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f3f4f6; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 340px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; color: #374151; }
    input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
    .links { margin-top: 14px; font-size: 13px; text-align: center; }
    .links a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Personal Hub</h1>
    <div class="sub">文件管理与个人博客</div>
    <form id="loginForm">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div class="err" id="err"></div>
      <button type="submit">登录</button>
    </form>
    <div class="links"><a href="/blog">前往公开博客 →</a></div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          errEl.textContent = d.error === 'INVALID_CREDENTIALS' ? '用户名或密码错误' : ('登录失败: ' + (d.error || r.status));
          return;
        }
        window.location.href = '/app';
      } catch (e) {
        errEl.textContent = '网络错误，请检查服务是否运行';
      }
    });
  </script>
</body>
</html>
