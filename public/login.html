<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Personal Hub</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <a class="brand" href="/">Personal<span>Hub</span></a>
      <p>登录后可写作、管理文件与文章</p>
    </div>
    <div class="card">
      <div class="form-item">
        <label for="username">用户名</label>
        <input type="text" id="username" autocomplete="username" />
      </div>
      <div class="form-item">
        <label for="password">密码</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <div id="msg" class="err" style="min-height:18px;margin-bottom:8px;"></div>
      <button class="btn" id="loginBtn">登 录</button>
      <div class="login-foot"><a href="/">← 返回首页</a></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/assets/api.js"></script>
  <script>
    (function () {
      'use strict';
      var api = HUB.api, qs = HUB.qs;
      var next = qs('next') || '/';

      async function tryLogin() {
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        if (!username || !password) { msg.textContent = '请输入用户名与密码'; return; }
        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中…';
        msg.textContent = '';
        try {
          await api('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
          });
          location.href = next;
        } catch (e) {
          msg.textContent = '登录失败：' + e.message;
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      }

      document.getElementById('loginBtn').addEventListener('click', tryLogin);
      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryLogin();
      });
      document.getElementById('username').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
      });
    })();
  </script>
</body>
</html>
