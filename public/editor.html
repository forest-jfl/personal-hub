<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写文章 · 半山日志</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0910" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <div class="page">
    <div class="card">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
        <input type="text" id="titleInput" placeholder="文章标题" style="flex:1;min-width:240px;font-size:16px;padding:10px 14px;" />
        <input type="text" id="categoryInput" list="categoryList" placeholder="分类（可选择或输入）" style="width:200px;" />
        <datalist id="categoryList"></datalist>
        <button class="btn" id="publishBtn">立即发布</button>
        <button class="btn btn-ghost" id="draftBtn">存为草稿</button>
        <a class="btn btn-ghost" id="consoleLink" href="./console.html">文章列表</a>
      </div>

      <!-- 封面：留空即无封面，列表与详情会退回纯文字版式（不会留破图框） -->
      <div class="cover-row">
        <div class="cover-thumb" id="coverThumb"><span class="muted">无封面</span></div>
        <div class="cover-actions">
          <button class="btn btn-ghost btn-sm" type="button" id="coverUploadBtn">上传封面</button>
          <button class="btn btn-ghost btn-sm" type="button" id="coverPickBtn">从图片库选</button>
          <button class="btn btn-ghost btn-sm hidden" type="button" id="coverClearBtn">清除封面</button>
          <span class="muted" id="coverState"></span>
        </div>
        <input type="file" id="coverInput" accept="image/*" class="hidden" />
      </div>

      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
        <span class="muted" id="slugPreview">永久链接将根据标题自动生成</span>
        <span class="muted" id="wordCount">0 字</span>
        <span class="muted" id="autoSaveState"></span>
        <span style="flex:1;"></span>
        <label class="muted" style="display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" id="autoSaveToggle" checked /> 自动保存
        </label>
      </div>
      <div id="msg" class="muted" style="min-height:18px;margin-bottom:8px;"></div>

      <!-- Markdown 工具栏 -->
      <div class="md-toolbar" id="mdToolbar">
        <button type="button" data-md="h1" title="一级标题">H1</button>
        <button type="button" data-md="h2" title="二级标题">H2</button>
        <button type="button" data-md="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
        <button type="button" data-md="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button type="button" data-md="code" title="行内代码">&lt;/&gt;</button>
        <button type="button" data-md="codeblock" title="代码块">{ }</button>
        <button type="button" data-md="quote" title="引用">❝</button>
        <button type="button" data-md="ul" title="无序列表">• 列表</button>
        <button type="button" data-md="ol" title="有序列表">1. 列表</button>
        <button type="button" data-md="link" title="链接 (Ctrl+K)">🔗</button>
        <button type="button" data-md="image" title="插入图片（自动上传）">🖼</button>
        <button type="button" data-md="table" title="表格">表格</button>
        <button type="button" data-md="hr" title="分隔线">—</button>
        <input type="file" id="imageInput" accept="image/*" class="hidden" />
      </div>

      <div class="editor-grid">
        <div class="editor-pane">
          <textarea id="contentInput" placeholder="正文，支持 Markdown。可直接粘贴/拖拽截图，自动上传为图床链接…"></textarea>
        </div>
        <div class="preview-pane post-html" id="previewPane">
          <span class="muted">预览区域（输入正文后自动刷新）</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 封面选择器：从已上传图片里挑一张，避免同一张图为了当封面重复占用空间 -->
  <div class="modal hidden" id="coverPicker" role="dialog" aria-modal="true" aria-label="从图片库选择封面">
    <div class="modal-panel">
      <div class="modal-head">
        <h3>从图片库选择封面</h3>
        <span class="modal-spacer"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="coverPickerClose">关闭</button>
      </div>
      <div class="modal-body">
        <div class="grid-images" id="coverPickerGrid"></div>
        <p class="muted" id="coverPickerEmpty" style="margin:12px 0 0;"></p>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/assets/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (function () {
      'use strict';
      var api = HUB.api, esc = HUB.esc, qs = HUB.qs, url = HUB.url;
      var editingId = qs('id') ? parseInt(qs('id'), 10) : null;
      var LS_KEY = 'hub_editor_draft';
      var loadedStatus = 'draft';   // 编辑已有文章时的原状态（自动保存不得改变发布状态）
      var dirty = false;
      var autoSaveTimer = null;
      var lastSavedSnapshot = '';

      var msgEl = document.getElementById('msg');
      function msg(text, cls) {
        msgEl.textContent = text;
        msgEl.className = cls || 'muted';
      }

      var $title = document.getElementById('titleInput');
      var $category = document.getElementById('categoryInput');
      var $content = document.getElementById('contentInput');

      /* ---------- 预览 / 字数 / slug ---------- */
      function slugify(title) {
        var base = title.toLowerCase().replace(/[^\w一-龥]+/g, '-').replace(/^-+|-+$/g, '');
        return base || 'post';
      }
      function renderPreview() {
        var pane = document.getElementById('previewPane');
        if (window.marked) {
          pane.innerHTML = String(window.marked.parse($content.value || ''));
        } else {
          pane.innerHTML = '<pre style="white-space:pre-wrap;">' + esc($content.value) + '</pre>';
        }
      }
      function renderMeta() {
        document.getElementById('wordCount').textContent = $content.value.length + ' 字';
        var t = $title.value.trim();
        document.getElementById('slugPreview').textContent = t
          ? '永久链接 /post?slug=' + slugify(t)
          : '永久链接将根据标题自动生成';
      }
      function markDirty() {
        dirty = true;
        renderMeta();
        renderPreview();
      }
      $title.addEventListener('input', markDirty);
      $content.addEventListener('input', markDirty);
      $category.addEventListener('input', markDirty);

      /* ---------- Markdown 工具栏 ---------- */
      function getSel() {
        return { start: $content.selectionStart, end: $content.selectionEnd };
      }
      function applyEdit(newText, selStart, selEnd) {
        $content.setRangeText(newText, selStart, selEnd, 'end');
        $content.focus();
        markDirty();
      }
      function wrap(before, after, placeholder) {
        var s = getSel();
        var selected = $content.value.slice(s.start, s.end) || placeholder;
        applyEdit(before + selected + after, s.start, s.end);
      }
      function linePrefix(prefix) {
        var s = getSel();
        var val = $content.value;
        var lineStart = val.lastIndexOf('\n', s.start - 1) + 1;
        applyEdit(prefix, lineStart, lineStart);
      }
      var toolbarActions = {
        h1: function () { linePrefix('# '); },
        h2: function () { linePrefix('## '); },
        bold: function () { wrap('**', '**', '加粗文字'); },
        italic: function () { wrap('*', '*', '斜体文字'); },
        code: function () { wrap('`', '`', 'code'); },
        codeblock: function () { wrap('\n```js\n', '\n```\n', '// 代码'); },
        quote: function () { linePrefix('> '); },
        ul: function () { linePrefix('- '); },
        ol: function () { linePrefix('1. '); },
        link: function () {
          var s = getSel();
          var text = $content.value.slice(s.start, s.end) || '链接文字';
          applyEdit('[' + text + '](https://)', s.start, s.end);
        },
        image: function () { document.getElementById('imageInput').click(); },
        table: function () {
          var s = getSel();
          var tpl = '\n| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n';
          applyEdit(tpl, s.start, s.end);
        },
        hr: function () { applyEdit('\n---\n', 0, 0); }
      };
      document.getElementById('mdToolbar').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-md]');
        if (!btn) return;
        toolbarActions[btn.dataset.md]();
      });

      /* ---------- 图片上传（选择 / 粘贴 / 拖拽，全自动） ---------- */
      async function uploadAndInsert(file) {
        if (!/^image\//.test(file.type)) { msg('仅支持图片文件', 'err'); return; }
        if (file.size > 20 * 1024 * 1024) { msg('图片不能超过 20MB', 'err'); return; }
        msg('图片上传中… ' + file.name);
        var fd = new FormData();
        fd.append('file', file);
        try {
          var d = await api('/api/files', { method: 'POST', body: fd });
          var link = url('/api/public/files/' + d.file.id + '/' + d.file.public_token);
          var alt = file.name.replace(/\.[^.]+$/, '');
          applyEdit('\n![' + esc(alt) + '](' + link + ')\n', 0, 0);
          msg('图片已插入', 'ok');
          scheduleAutoSave();
        } catch (e) {
          var m = e.message;
          if (m === 'QUOTA_EXCEEDED') m = '文件空间已用完，请先清理不再使用的文件';
          else if (m === 'FILE_TOO_LARGE') m = '图片超过单文件大小上限';
          else if (m && m.indexOf('BLOCKED_FILE_TYPE') === 0) m = '不允许上传该类型文件';
          msg('图片上传失败：' + m, 'err');
        }
      }
      document.getElementById('imageInput').addEventListener('change', function (e) {
        if (e.target.files[0]) uploadAndInsert(e.target.files[0]);
        e.target.value = '';
      });
      // 粘贴截图直接上传
      $content.addEventListener('paste', function (e) {
        var items = (e.clipboardData || {}).items || [];
        for (var i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') === 0) {
            e.preventDefault();
            uploadAndInsert(items[i].getAsFile());
            return;
          }
        }
      });
      // 拖拽图片直接上传
      $content.addEventListener('drop', function (e) {
        var files = (e.dataTransfer || {}).files || [];
        if (files.length && /^image\//.test(files[0].type)) {
          e.preventDefault();
          uploadAndInsert(files[0]);
        }
      });

      /* ---------- 封面 ----------
         coverValue 是唯一事实来源，'' 表示无封面。
         清空时必须真的写回空串：留着一个指向已删图片的地址会在列表与详情渲染成破图。 */
      var coverValue = '';
      var $coverThumb = document.getElementById('coverThumb');
      var $coverState = document.getElementById('coverState');
      var $coverClear = document.getElementById('coverClearBtn');
      var $coverInput = document.getElementById('coverInput');

      function renderCover() {
        var v = HUB.safeCover(coverValue);
        coverValue = v;
        if (v) {
          $coverThumb.innerHTML = '<img src="' + esc(v) + '" alt="封面预览" />';
          $coverClear.classList.remove('hidden');
          $coverState.textContent = '';
        } else {
          $coverThumb.innerHTML = '<span class="muted">无封面</span>';
          $coverClear.classList.add('hidden');
          $coverState.textContent = '未设置封面';
        }
      }
      function setCover(v) {
        coverValue = String(v || '');
        renderCover();
        markDirty();
      }

      // 上传封面：走同一个 /api/files，成功后设为封面（不插入正文）
      document.getElementById('coverUploadBtn').addEventListener('click', function () { $coverInput.click(); });
      $coverInput.addEventListener('change', async function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!/^image\//.test(file.type)) { msg('仅支持图片文件', 'err'); return; }
        if (file.size > 20 * 1024 * 1024) { msg('图片不能超过 20MB', 'err'); return; }
        $coverState.textContent = '上传中…';
        var fd = new FormData();
        fd.append('file', file);
        try {
          var d = await api('/api/files', { method: 'POST', body: fd });
          setCover(url('/api/public/files/' + d.file.id + '/' + d.file.public_token));
          msg('封面已设置（保存文章后生效）', 'ok');
          scheduleAutoSave();
        } catch (err) {
          var m = err.message;
          if (m === 'QUOTA_EXCEEDED') m = '文件空间已用完，请先清理不再使用的文件';
          else if (m === 'FILE_TOO_LARGE') m = '图片超过单文件大小上限';
          else if (m && m.indexOf('BLOCKED_FILE_TYPE') === 0) m = '不允许上传该类型文件';
          msg('封面上传失败：' + m, 'err');
          renderCover();
        }
      });

      $coverClear.addEventListener('click', function () {
        setCover('');
        msg('已清除封面（保存文章后生效）', 'ok');
      });

      /* 从图片库选封面（接口只返回本人图片，与删除接口同一权限口径） */
      var $coverPicker = document.getElementById('coverPicker');
      var $coverPickerGrid = document.getElementById('coverPickerGrid');
      var $coverPickerEmpty = document.getElementById('coverPickerEmpty');
      var coverPickerLoaded = false;

      function closeCoverPicker() { $coverPicker.classList.add('hidden'); }
      function openCoverPicker() {
        $coverPicker.classList.remove('hidden');
        if (!coverPickerLoaded) loadCoverPicker();
        else syncPickerSelection();
      }
      function syncPickerSelection() {
        var items = $coverPickerGrid.querySelectorAll('.grid-item');
        for (var i = 0; i < items.length; i++) {
          items[i].classList.toggle('is-selected', items[i].dataset.url === coverValue);
        }
      }
      async function loadCoverPicker() {
        $coverPickerGrid.innerHTML = '';
        $coverPickerEmpty.textContent = '加载中…';
        try {
          var d = await api('/api/files/images?limit=60');
          var imgs = d.images || [];
          coverPickerLoaded = true;
          if (!imgs.length) {
            $coverPickerEmpty.textContent = '图片库还是空的 —— 用「上传封面」，或在正文工具栏点 🖼 上传即可。';
            return;
          }
          $coverPickerEmpty.textContent = '共 ' + (d.total || imgs.length) + ' 张' +
            ((d.total || imgs.length) > imgs.length ? '（最多显示 ' + imgs.length + ' 张）' : '') +
            ' · 点击选为封面';
          $coverPickerGrid.innerHTML = imgs.map(function (f) {
            var link = HUB.fileUrl(f);
            return '<div class="grid-item" data-url="' + esc(link) + '" title="' + esc(f.original_name) + '">' +
              '<img src="' + esc(link) + '" alt="' + esc(f.original_name) + '" loading="lazy" />' +
              '<div class="grid-name">' + esc(f.original_name) + '</div>' +
              '</div>';
          }).join('');
          syncPickerSelection();
        } catch (e) {
          $coverPickerEmpty.textContent = '图片库加载失败：' + e.message;
        }
      }
      $coverPickerGrid.addEventListener('click', function (e) {
        var item = e.target.closest('.grid-item');
        if (!item) return;
        setCover(item.dataset.url);
        syncPickerSelection();
        closeCoverPicker();
        msg('封面已设置（保存文章后生效）', 'ok');
      });
      document.getElementById('coverPickBtn').addEventListener('click', openCoverPicker);
      document.getElementById('coverPickerClose').addEventListener('click', closeCoverPicker);
      // 点遮罩关闭；面板内的点击不冒泡到遮罩判定
      $coverPicker.addEventListener('click', function (e) {
        if (e.target === $coverPicker) closeCoverPicker();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !$coverPicker.classList.contains('hidden')) closeCoverPicker();
      });

      /* ---------- 快捷键 ---------- */
      document.addEventListener('keydown', function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        var k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); savePost(currentIntentStatus()); }
        else if (k === 'b') { e.preventDefault(); toolbarActions.bold(); }
        else if (k === 'i') { e.preventDefault(); toolbarActions.italic(); }
        else if (k === 'k') { e.preventDefault(); toolbarActions.link(); }
      });

      /* ---------- 保存 / 发布 ---------- */
      function collectPayload(status) {
        return {
          title: $title.value.trim(),
          content: $content.value,
          category: $category.value.trim(),
          cover: coverValue,
          status: status
        };
      }
      function currentIntentStatus() {
        // 编辑已有文章时保留原状态语义：有原状态则维持，否则视为发布
        return editingId ? loadedStatus : 'published';
      }
      function snapshot() {
        return JSON.stringify([editingId, $title.value, $category.value, $content.value, coverValue]);
      }
      async function savePost(status, btn) {
        var payload = collectPayload(status);
        if (!payload.title) { msg('请填写标题', 'err'); return; }
        if (btn) btn.disabled = true;
        msg('保存中…');
        try {
          if (editingId) {
            await api('/api/posts/' + editingId, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            loadedStatus = status; // 同步原状态，自动保存与后续操作以此为基准
          } else {
            var d = await api('/api/posts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            editingId = d.post.id;
            loadedStatus = status;
            try { history.replaceState(null, '', url('/editor?id=' + editingId)); } catch (e) { /* 跨源页面忽略 */ }
            localStorage.removeItem(LS_KEY);
          }
          dirty = false;
          lastSavedSnapshot = snapshot();
          var label = status === 'published' ? '已发布' : '已存为草稿';
          msg(label + ' · ' + new Date().toLocaleTimeString(), 'ok');
          document.title = (payload.title) + ' · 半山日志';
          scheduleAutoSave();
        } catch (e) {
          msg('保存失败：' + e.message, 'err');
        }
        if (btn) btn.disabled = false;
      }
      document.getElementById('publishBtn').addEventListener('click', function () { savePost('published', this); });
      document.getElementById('draftBtn').addEventListener('click', function () { savePost('draft', this); });

      /* ---------- 自动保存 ---------- */
      function scheduleAutoSave() {
        clearTimeout(autoSaveTimer);
        if (!document.getElementById('autoSaveToggle').checked) return;
        autoSaveTimer = setTimeout(autoSave, 30 * 1000);
      }
      async function autoSave() {
        scheduleAutoSave(); // 无论本次是否保存，都排下一次
        if (!dirty && snapshot() === lastSavedSnapshot) return;
        var stateEl = document.getElementById('autoSaveState');
        try {
          if (editingId) {
            // 自动保存不改变发布状态
            var payload = collectPayload(loadedStatus);
            if (!payload.title) return;
            await api('/api/posts/' + editingId, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            stateEl.textContent = '已自动保存 ' + new Date().toLocaleTimeString();
            lastSavedSnapshot = snapshot();
            dirty = false;
          } else {
            // 新文章：先本地兜底，等手动保存时落库
            localStorage.setItem(LS_KEY, snapshot());
            stateEl.textContent = '本地草稿已备份 ' + new Date().toLocaleTimeString();
          }
        } catch (e) {
          stateEl.textContent = '自动保存失败，将自动重试';
        }
      }
      document.getElementById('autoSaveToggle').addEventListener('change', function () {
        if (this.checked) scheduleAutoSave(); else clearTimeout(autoSaveTimer);
      });

      // 关闭页面前提示未保存内容
      window.addEventListener('beforeunload', function (e) {
        if (dirty && snapshot() !== lastSavedSnapshot) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      /* ---------- 载入 ---------- */
      function restoreLocalDraft() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (!raw) return;
          var arr = JSON.parse(raw);
          if (arr[0]) return; // 仅恢复"新文章"本地草稿
          if (arr[1] || arr[3] || arr[4]) {
            $title.value = arr[1] || '';
            $category.value = arr[2] || '';
            $content.value = arr[3] || '';
            // 第 5 位是本次新增的封面；旧草稿只有 4 位，读不到即视为无封面
            coverValue = HUB.safeCover(arr[4] || '');
            renderCover();
            msg('已恢复上次未保存的本地草稿', 'ok');
          }
        } catch (e) { /* ignore */ }
      }

      async function loadCategories() {
        try {
          var m = await api('/api/public/meta');
          document.getElementById('categoryList').innerHTML = m.categories
            .map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('');
        } catch (e) { /* ignore */ }
      }

      async function loadEditing() {
        if (!editingId) {
          restoreLocalDraft();
          renderCover();
          $title.focus();
          renderMeta();
          renderPreview();
          return;
        }
        try {
          var d = await api('/api/posts');
          var p = d.posts.find(function (x) { return x.id === editingId; });
          if (!p) { msg('未找到该文章（可能无权限）', 'err'); return; }
          $title.value = p.title;
          $category.value = p.category || '';
          loadedStatus = p.status;
          $content.value = p.content || '';
          // 历史上可能存过不合规的封面地址（如 http://），前端再过滤一层，
          // 与后端 isValidCover 同规则：不过关即按"无封面"处理
          coverValue = HUB.safeCover(p.cover || '');
          renderCover();
          document.title = '编辑：' + p.title + ' · 半山日志';
          lastSavedSnapshot = snapshot();
          renderMeta();
          renderPreview();
        } catch (e) {
          msg('加载文章失败：' + e.message, 'err');
        }
      }

      (async function init() {
        document.getElementById('consoleLink').href = url('/console');
        var me = await HUB.requireMe();
        if (!me) return;
        HUB.renderNav(me);
        await loadCategories();
        loadEditing();
        scheduleAutoSave();
      })();
    })();
  </script>
</body>
</html>
