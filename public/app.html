<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理台 - Personal Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f4f6; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    header .right { display: flex; align-items: center; gap: 14px; font-size: 14px; }
    header a { color: #93c5fd; text-decoration: none; }
    .tabs { display: flex; gap: 4px; background: #e5e7eb; padding: 8px 20px 0; }
    .tab { padding: 10px 16px; cursor: pointer; border-radius: 8px 8px 0 0; font-size: 14px; background: #d1d5db; color: #374151; }
    .tab.active { background: #fff; font-weight: 600; }
    main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .panel { display: none; background: #fff; padding: 20px; border-radius: 0 8px 8px 8px; }
    .panel.active { display: block; }
    h2 { font-size: 18px; margin: 0 0 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    input, select, textarea { padding: 9px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
    textarea { width: 100%; min-height: 120px; resize: vertical; }
    input[type=text], select { min-width: 180px; }
    button { padding: 9px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 14px; }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.ghost { background: #e5e7eb; color: #374151; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; }
    th { color: #6b7280; font-weight: 600; font-size: 13px; }
    .muted { color: #6b7280; font-size: 13px; }
    .msg { margin: 8px 0; font-size: 13px; min-height: 16px; }
    .msg.err { color: #dc2626; }
    .msg.ok { color: #16a34a; }
    a.dl { color: #2563eb; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <strong>Personal Hub · 管理台</strong>
    <div class="right">
      <span id="who"></span>
      <a href="/blog" target="_blank">公开博客</a>
      <a href="#" id="logout">退出</a>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="files">文件管理</div>
    <div class="tab" data-tab="posts">博客管理</div>
    <div class="tab hidden" id="tab-users" data-tab="users">用户管理</div>
  </div>

  <main>
    <!-- 文件 -->
    <section class="panel active" id="panel-files">
      <h2>文件管理</h2>
      <div class="row">
        <input type="file" id="fileInput" />
        <button id="uploadBtn">上传</button>
        <span class="muted" id="uploadMsg"></span>
      </div>
      <div id="filesMsg" class="msg"></div>
      <table>
        <thead><tr><th>文件名</th><th>大小</th><th>上传者ID</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="filesBody"></tbody>
      </table>
    </section>

    <!-- 博客 -->
    <section class="panel" id="panel-posts">
      <h2>博客管理</h2>
      <div class="row">
        <input type="text" id="postTitle" placeholder="标题" style="min-width:280px" />
        <select id="postStatus">
          <option value="draft">草稿</option>
          <option value="published">发布</option>
        </select>
        <button id="postSave">保存</button>
        <button class="ghost" id="postCancel">取消编辑</button>
        <span class="muted" id="editingHint"></span>
      </div>
      <textarea id="postContent" placeholder="正文（支持 Markdown）"></textarea>
      <div id="postsMsg" class="msg"></div>
      <table>
        <thead><tr><th>标题</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead>
        <tbody id="postsBody"></tbody>
      </table>
    </section>

    <!-- 用户 -->
    <section class="panel" id="panel-users">
      <h2>用户管理（仅管理员）</h2>
      <div class="row">
        <input type="text" id="uName" placeholder="用户名" />
        <input type="text" id="uDisp" placeholder="显示名" />
        <input type="text" id="uPass" placeholder="初始密码" />
        <select id="uRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
        <button id="uCreate">创建用户</button>
      </div>
      <div id="usersMsg" class="msg"></div>
      <table>
        <thead><tr><th>ID</th><th>用户名</th><th>显示名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let me = null;
    let editingPostId = null;

    function fmtSize(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function api(url, opts){ const r = await fetch(url, Object.assign({credentials:'same-origin'}, opts)); const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('HTTP '+r.status)); return d; }

    // 鉴权与登出
    (async () => {
      try { const d = await api('/api/auth/me'); me = d.user; }
      catch { window.location.href = '/login'; return; }
      $('who').textContent = me.display_name + '（' + me.role + '）';
      if (me.role === 'admin') $('tab-users').classList.remove('hidden');
      loadFiles(); loadPosts(); if (me.role === 'admin') loadUsers();
    })();

    $('logout').addEventListener('click', async (e) => {
      e.preventDefault(); await api('/api/auth/logout', {method:'POST'}); window.location.href = '/login';
    });

    // Tab 切换
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('panel-' + t.dataset.tab).classList.add('active');
    }));

    // ---- 文件 ----
    async function loadFiles(){
      try { const { files } = await api('/api/files');
        $('filesBody').innerHTML = files.map(f => `<tr>
          <td>${esc(f.original_name)}</td>
          <td>${fmtSize(f.size)}</td>
          <td>${f.owner_id}</td>
          <td class="muted">${new Date(f.created_at).toLocaleString()}</td>
          <td><a class="dl" href="/api/files/${f.id}/download">下载</a> · <a class="dl" href="#" data-del="${f.id}">删除</a></td>
        </tr>`).join('') || '<tr><td colspan="5" class="muted">暂无文件</td></tr>';
      } catch(e){ $('filesMsg').textContent = e.message; $('filesMsg').className='msg err'; }
    }
    $('uploadBtn').addEventListener('click', async () => {
      const f = $('fileInput').files[0];
      if (!f) { $('uploadMsg').textContent = '请选择文件'; return; }
      const fd = new FormData(); fd.append('file', f);
      $('uploadMsg').textContent = '上传中…';
      try { await api('/api/files', {method:'POST', body: fd}); $('uploadMsg').textContent=''; $('fileInput').value=''; loadFiles(); }
      catch(e){ $('uploadMsg').textContent = e.message; }
    });
    $('filesBody').addEventListener('click', async (e) => {
      const id = e.target.dataset.del; if (!id) return; e.preventDefault();
      if (!confirm('确定删除该文件？')) return;
      try { await api('/api/files/'+id, {method:'DELETE'}); loadFiles(); } catch(err){ alert(err.message); }
    });

    // ---- 博客 ----
    async function loadPosts(){
      try { const { posts } = await api('/api/posts');
        $('postsBody').innerHTML = posts.map(p => `<tr>
          <td>${esc(p.title)}</td>
          <td>${p.status==='published'?'发布':'草稿'}</td>
          <td class="muted">${new Date(p.updated_at).toLocaleString()}</td>
          <td><a class="dl" href="#" data-edit="${p.id}">编辑</a> · <a class="dl" href="#" data-del="${p.id}">删除</a></td>
        </tr>`).join('') || '<tr><td colspan="4" class="muted">暂无文章</td></tr>';
      } catch(e){ $('postsMsg').textContent = e.message; $('postsMsg').className='msg err'; }
    }
    $('postCancel').addEventListener('click', resetPostForm);
    function resetPostForm(){ editingPostId=null; $('postTitle').value=''; $('postContent').value=''; $('postStatus').value='draft'; $('editingHint').textContent=''; }
    $('postSave').addEventListener('click', async () => {
      const title = $('postTitle').value.trim(); const content = $('postContent').value; const status=$('postStatus').value;
      if (!title) { $('postsMsg').textContent='请填写标题'; $('postsMsg').className='msg err'; return; }
      try {
        if (editingPostId) await api('/api/posts/'+editingPostId, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title,content,status})});
        else await api('/api/posts', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title,content,status})});
        $('postsMsg').textContent='已保存'; $('postsMsg').className='msg ok'; resetPostForm(); loadPosts();
      } catch(e){ $('postsMsg').textContent=e.message; $('postsMsg').className='msg err'; }
    });
    $('postsBody').addEventListener('click', async (e) => {
      const del = e.target.dataset.del, edit = e.target.dataset.edit; if(!del && !edit) return; e.preventDefault();
      if (del) { if(!confirm('确定删除该文章？')) return; try{ await api('/api/posts/'+del,{method:'DELETE'}); loadPosts(); }catch(err){alert(err.message);} }
      if (edit) {
        const { posts } = await api('/api/posts'); const p = posts.find(x=>String(x.id)===edit); if(!p) return;
        editingPostId = p.id; $('postTitle').value=p.title; $('postContent').value=p.content; $('postStatus').value=p.status;
        $('editingHint').textContent='编辑中：'+p.title; window.scrollTo({top:0,behavior:'smooth'});
      }
    });

    // ---- 用户（管理员）----
    async function loadUsers(){
      try { const { users } = await api('/api/users');
        $('usersBody').innerHTML = users.map(u => `<tr>
          <td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.display_name)}</td><td>${u.role}</td>
          <td class="muted">${new Date(u.created_at).toLocaleString()}</td>
          <td><a class="dl" href="#" data-del="${u.id}">删除</a></td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted">暂无其他用户</td></tr>';
      } catch(e){ $('usersMsg').textContent = e.message; $('usersMsg').className='msg err'; }
    }
    $('uCreate').addEventListener('click', async () => {
      const username=$('uName').value.trim(), display_name=$('uDisp').value.trim(), password=$('uPass').value, role=$('uRole').value;
      if(!username||!password){ $('usersMsg').textContent='用户名与密码必填'; $('usersMsg').className='msg err'; return; }
      try { await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,display_name,password,role})});
        $('usersMsg').textContent='已创建'; $('usersMsg').className='msg ok'; $('uName').value=''; $('uDisp').value=''; $('uPass').value=''; loadUsers();
      } catch(e){ $('usersMsg').textContent=e.message; $('usersMsg').className='msg err'; }
    });
    $('usersBody').addEventListener('click', async (e) => {
      const id=e.target.dataset.del; if(!id) return; e.preventDefault();
      if(!confirm('确定删除该用户？')) return;
      try{ await api('/api/users/'+id,{method:'DELETE'}); loadUsers(); }catch(err){alert(err.message);}
    });
  </script>
</body>
</html>
