<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · Personal Hub</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <div class="page">
    <div class="layout">
      <main class="layout-main">
        <div class="card post-detail" id="postBox">
          <div class="muted">加载中…</div>
        </div>
      </main>

      <aside class="layout-side">
        <div class="card">
          <h3 class="side-title">文章信息</h3>
          <ul class="side-list" id="postInfo"><li><span class="muted">加载中…</span></li></ul>
        </div>
        <div class="card">
          <h3 class="side-title">热门文章</h3>
          <ul class="side-list" id="hotList"><li><span class="muted">加载中…</span></li></ul>
        </div>
        <div class="card">
          <a class="btn btn-ghost btn-sm" href="./" style="width:100%;text-align:center;">← 返回首页</a>
        </div>
      </aside>
    </div>
  </div>

  <footer class="site-footer">Personal Hub · 由 Node.js + Express 驱动</footer>

  <script src="/config.js"></script>
  <script src="/assets/api.js"></script>
  <script>
    (function () {
      'use strict';
      var api = HUB.api, esc = HUB.esc, qs = HUB.qs;
      var slug = qs('slug');

      async function loadPost() {
        var box = document.getElementById('postBox');
        if (!slug) { box.innerHTML = '<div class="err">缺少文章参数（?slug=）</div>'; return; }
        try {
          var d = await api('/api/public/posts/' + encodeURIComponent(slug));
          var p = d.post;
          document.title = p.title + ' · Personal Hub';
          var cat = p.category ? '<a class="tag" href="./?category=' + encodeURIComponent(p.category) + '">' + esc(p.category) + '</a>' : '';
          box.innerHTML =
            '<h1>' + esc(p.title) + '</h1>' +
            '<div class="post-meta" style="margin-bottom:16px;">' +
            '  <span>' + esc(p.author_name || '佚名') + '</span>' +
            '  <span>发布于 ' + HUB.fmtDate(p.created_at) + '</span>' +
            '  <span>阅读 ' + (p.views || 0) + '</span>' +
            '  ' + cat +
            '</div>' +
            '<div class="post-html">' + p.html + '</div>';
          document.getElementById('postInfo').innerHTML =
            '<li><span class="muted">作者</span><span>' + esc(p.author_name || '佚名') + '</span></li>' +
            '<li><span class="muted">发布</span><span>' + HUB.fmtDate(p.created_at) + '</span></li>' +
            '<li><span class="muted">更新</span><span>' + HUB.fmtDate(p.updated_at) + '</span></li>' +
            '<li><span class="muted">阅读</span><span>' + (p.views || 0) + '</span></li>' +
            '<li><span class="muted">分类</span><span>' + esc(p.category || '未分类') + '</span></li>';
        } catch (e) {
          box.innerHTML = '<div class="err">文章加载失败：' + esc(e.message) + '</div>';
        }
      }

      async function loadHot() {
        try {
          var m = await api('/api/public/meta');
          document.getElementById('hotList').innerHTML = m.hot.length
            ? m.hot.map(function (h, i) {
                return '<li><a href="./post.html?slug=' + encodeURIComponent(h.slug) + '">' + (i + 1) + '. ' + esc(h.title) + '</a><span class="count">' + h.views + '</span></li>';
              }).join('')
            : '<li><span class="muted">暂无数据</span></li>';
        } catch (e) { /* ignore */ }
      }

      (async function init() {
        HUB.renderNav(await HUB.fetchMe());
        loadPost();
        loadHot();
      })();
    })();
  </script>
</body>
</html>
