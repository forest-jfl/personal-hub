<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 - Personal Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fafafa; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 16px 24px; }
    header a { color: #93c5fd; text-decoration: none; font-size: 14px; }
    main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 28px; line-height: 1.3; }
    .meta { color: #6b7280; font-size: 13px; margin: 8px 0 24px; }
    .content { line-height: 1.75; font-size: 16px; }
    .content pre { background: #f3f4f6; padding: 12px; border-radius: 8px; overflow: auto; }
    .content code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .content pre code { background: none; padding: 0; }
    .content img { max-width: 100%; }
    .content a { color: #2563eb; }
    .err, .empty { color: #6b7280; margin-top: 24px; }
  </style>
</head>
<body>
  <header><a href="/blog">← 返回博客列表</a></header>
  <main>
    <div id="post"><div class="empty">加载中…</div></div>
  </main>
  <script>
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function load() {
      const el = document.getElementById('post');
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) { el.innerHTML = '<div class="empty">缺少文章参数。</div>'; return; }
      try {
        const r = await fetch('/api/public/posts/' + encodeURIComponent(slug), { credentials: 'same-origin' });
        if (!r.ok) throw new Error('not found');
        const { post } = await r.json();
        document.title = post.title + ' - Personal Hub';
        el.innerHTML = `<h1>${escapeHtml(post.title)}</h1>
          <div class="meta">${new Date(post.created_at).toLocaleString()}</div>
          <div class="content">${post.html}</div>`;
      } catch (e) {
        el.innerHTML = '<div class="err">文章不存在或加载失败。</div>';
      }
    }
    load();
  </script>
</body>
</html>
