<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理控制台 · Personal Hub</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <div class="page">
    <div class="card" style="max-width:980px;margin:0 auto;">
      <div class="console-tabs">
        <button class="console-tab active" data-tab="posts">文章管理</button>
        <button class="console-tab" data-tab="files">文件管理</button>
        <button class="console-tab hidden" data-tab="users" id="tabUsers">用户管理</button>
        <button class="console-tab hidden" data-tab="remote" id="tabRemote">远程控制</button>
        <button class="console-tab" data-tab="account" id="tabAccount">账号设置</button>
      </div>

      <div id="msg" style="min-height:18px;margin-bottom:10px;" class="muted"></div>

      <!-- 文章管理 -->
      <section id="panel-posts">
        <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;">
          <a class="btn btn-sm" href="./editor.html">✎ 新建文章</a>
          <span class="muted">点击"编辑"进入写作页修改内容</span>
        </div>
        <table class="table">
          <thead><tr><th>标题</th><th>分类</th><th>状态</th><th>更新时间</th><th style="width:130px;">操作</th></tr></thead>
          <tbody id="postsBody"></tbody>
        </table>
      </section>

      <!-- 文件管理 -->
      <section id="panel-files" class="hidden">
        <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;">
          <input type="file" id="fileInput" />
          <button class="btn btn-sm" id="uploadBtn">上传</button>
          <span class="muted" id="uploadMsg"></span>
          <span style="flex:1;"></span>
          <span class="muted" id="quotaInfo"></span>
        </div>
        <table class="table">
          <thead><tr><th>文件名</th><th>大小</th><th>上传者</th><th>时间</th><th style="width:120px;">操作</th></tr></thead>
          <tbody id="filesBody"></tbody>
        </table>
      </section>

      <!-- 用户管理（仅管理员） -->
      <section id="panel-users" class="hidden">
        <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <input type="text" id="uName" placeholder="用户名" style="width:140px;" />
          <input type="text" id="uDisp" placeholder="显示名" style="width:140px;" />
          <input type="text" id="uPass" placeholder="初始密码" style="width:140px;" />
          <select id="uRole" style="width:130px;">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
          <button class="btn btn-sm" id="uCreate">创建用户</button>
        </div>
        <table class="table">
          <thead><tr><th>ID</th><th>用户名</th><th>显示名</th><th>角色</th><th>状态</th><th>创建时间</th><th style="width:130px;">操作</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </section>

      <!-- 远程控制（仅管理员）：WebSocket 运维通道 -->
      <section id="panel-remote" class="hidden">
        <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm" id="rcConnect">连接</button>
          <button class="btn btn-sm hidden" id="rcDisconnect">断开</button>
          <span class="muted" id="rcStatus">未连接</span>
          <span style="flex:1;"></span>
          <span class="muted">命令在服务端白名单内执行，全程审计留痕</span>
        </div>
        <div id="rcQuick" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;"></div>
        <pre id="remoteOut" style="background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:10px;max-height:420px;overflow:auto;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;min-height:120px;margin:0;">[远程控制台] 点击「连接」建立通道，快捷按钮或底部输入框下发命令。</pre>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <input type="text" id="rcInput" placeholder="输入命令，如：status / disk / help" style="flex:1;" autocomplete="off" />
          <button class="btn btn-sm" id="rcSend">执行</button>
        </div>
      </section>

      <!-- 账号设置（所有登录用户）：修改密码 -->
      <section id="panel-account" class="hidden" style="max-width:420px;">
        <h3 style="margin:0 0 4px;">修改密码</h3>
        <p class="muted" style="margin:0 0 12px;">修改成功后将自动退出，请使用新密码重新登录。</p>
        <div class="form-item">
          <label for="cpOld">当前密码</label>
          <input type="password" id="cpOld" autocomplete="current-password" style="width:100%;" />
        </div>
        <div class="form-item">
          <label for="cpNew">新密码（至少 8 位）</label>
          <input type="password" id="cpNew" autocomplete="new-password" style="width:100%;" />
        </div>
        <div class="form-item">
          <label for="cpNew2">确认新密码</label>
          <input type="password" id="cpNew2" autocomplete="new-password" style="width:100%;" />
        </div>
        <button class="btn" id="cpBtn">确认修改</button>
      </section>
    </div>
  </div>

  <footer class="site-footer">Personal Hub · 管理控制台</footer>

  <script src="/config.js"></script>
  <script src="/assets/api.js"></script>
  <script src="/assets/remote-control.js"></script>
  <script>
    (function () {
      'use strict';
      var api = HUB.api, esc = HUB.esc, qs = HUB.qs, url = HUB.url;
      var me = null;
      var msgEl = document.getElementById('msg');
      function msg(text, cls) { msgEl.textContent = text; msgEl.className = cls || 'muted'; }

      // ---- Tab 切换 ----
      document.querySelector('.console-tabs').addEventListener('click', function (e) {
        var t = e.target.closest('.console-tab');
        if (!t) return;
        document.querySelectorAll('.console-tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        ['posts', 'files', 'users', 'remote', 'account'].forEach(function (k) {
          document.getElementById('panel-' + k).classList.toggle('hidden', k !== t.dataset.tab);
        });
      });

      // ---- 文章管理 ----
      async function loadPosts() {
        try {
          var d = await api('/api/posts');
          document.getElementById('postsBody').innerHTML = d.posts.map(function (p) {
            return '<tr>' +
              '<td><a href="' + url('./post.html?slug=' + encodeURIComponent(p.slug)) + '" target="_blank" style="color:var(--primary);">' + esc(p.title) + '</a></td>' +
              '<td>' + esc(p.category || '-') + '</td>' +
              '<td>' + (p.status === 'published' ? '<span class="ok">已发布</span>' : '<span class="muted">草稿</span>') + '</td>' +
              '<td class="muted">' + HUB.fmtDate(p.updated_at) + '</td>' +
              '<td><button class="link-btn" data-edit="' + p.id + '">编辑</button> · ' +
              '<button class="link-btn danger" data-del="' + p.id + '">删除</button></td>' +
              '</tr>';
          }).join('') || '<tr><td colspan="5" class="muted">暂无文章</td></tr>';
        } catch (e) { msg('文章加载失败：' + e.message, 'err'); }
      }
      document.getElementById('postsBody').addEventListener('click', async function (e) {
        var edit = e.target.dataset.edit, del = e.target.dataset.del;
        if (edit) { location.href = url('/editor?id=' + edit); return; }
        if (del) {
          if (!confirm('确定删除该文章？')) return;
          try { await api('/api/posts/' + del, { method: 'DELETE' }); msg('已删除', 'ok'); loadPosts(); }
          catch (err) { msg('删除失败：' + err.message, 'err'); }
        }
      });

      // ---- 文件管理 ----
      async function loadFiles() {
        try {
          var d = await api('/api/files');
          var usedMB = (d.used / 1048576).toFixed(1), quotaMB = Math.round(d.quota / 1048576);
          var maxMB = Math.round(d.maxFileSize / 1048576);
          document.getElementById('quotaInfo').textContent =
            '空间用量 ' + usedMB + ' / ' + quotaMB + ' MB · 单文件 ≤ ' + maxMB + ' MB';
          document.getElementById('filesBody').innerHTML = d.files.map(function (f) {
            return '<tr>' +
              '<td>' + esc(f.original_name) + '</td>' +
              '<td>' + HUB.fmtSize(f.size) + '</td>' +
              '<td>' + (f.owner_name ? esc(f.owner_name) : ('#' + f.owner_id)) + '</td>' +
              '<td class="muted">' + HUB.fmtDate(f.created_at) + '</td>' +
              '<td><a class="link-btn" style="text-decoration:none;" href="' + HUB.url('/api/files/' + f.id + '/download') + '">下载</a> · ' +
              '<button class="link-btn danger" data-del="' + f.id + '">删除</button></td>' +
              '</tr>';
          }).join('') || '<tr><td colspan="5" class="muted">暂无文件</td></tr>';
        } catch (e) { msg('文件加载失败：' + e.message, 'err'); }
      }
      document.getElementById('uploadBtn').addEventListener('click', async function () {
        var f = document.getElementById('fileInput').files[0];
        var upMsg = document.getElementById('uploadMsg');
        if (!f) { upMsg.textContent = '请先选择文件'; return; }
        var fd = new FormData();
        fd.append('file', f);
        upMsg.textContent = '上传中…';
        try {
          await api('/api/files', { method: 'POST', body: fd });
          upMsg.textContent = '';
          document.getElementById('fileInput').value = '';
          msg('上传成功', 'ok');
          loadFiles();
        } catch (e) {
          var m = e.message;
          if (m === 'QUOTA_EXCEEDED') m = '文件空间已用完，请清理后重试';
          else if (m === 'FILE_TOO_LARGE') m = '文件超过单文件大小上限';
          else if (m && m.indexOf('BLOCKED_FILE_TYPE') === 0) m = '不允许上传该类型文件';
          else m = '上传失败：' + m;
          upMsg.textContent = m;
        }
      });
      document.getElementById('filesBody').addEventListener('click', async function (e) {
        var id = e.target.dataset.del;
        if (!id) return;
        if (!confirm('确定删除该文件？')) return;
        try { await api('/api/files/' + id, { method: 'DELETE' }); msg('已删除', 'ok'); loadFiles(); }
        catch (err) { msg('删除失败：' + err.message, 'err'); }
      });

      // ---- 用户管理（管理员） ----
      var myId = null;
      async function loadUsers() {
        try {
          var d = await api('/api/users');
          document.getElementById('usersBody').innerHTML = d.users.map(function (u) {
            var disabled = u.status === 'disabled';
            var statusHtml = disabled ? '<span class="err">已停用</span>' : '<span class="ok">正常</span>';
            var ops = '';
            if (u.id !== myId) {
              ops = (disabled
                ? '<button class="link-btn" data-enable="' + u.id + '">启用</button>'
                : '<button class="link-btn" data-disable="' + u.id + '">停用</button>') +
                ' · <button class="link-btn danger" data-del="' + u.id + '">删除</button>';
            } else {
              ops = '<span class="muted">当前用户</span>';
            }
            return '<tr' + (disabled ? ' style="opacity:.55;"' : '') + '>' +
              '<td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.display_name) + '</td>' +
              '<td>' + (u.role === 'admin' ? '管理员' : '普通用户') + '</td>' +
              '<td>' + statusHtml + '</td>' +
              '<td class="muted">' + HUB.fmtDate(u.created_at) + '</td>' +
              '<td>' + ops + '</td>' +
              '</tr>';
          }).join('') || '<tr><td colspan="7" class="muted">暂无其他用户</td></tr>';
        } catch (e) { msg('用户加载失败：' + e.message, 'err'); }
      }
      async function setUserStatus(id, status, tip) {
        if (!confirm(tip)) return;
        try {
          await api('/api/users/' + id + '/status', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: status })
          });
          msg(status === 'disabled' ? '已停用' : '已启用', 'ok');
          loadUsers();
        } catch (err) {
          var m = err.message;
          if (m === 'CANNOT_DISABLE_SELF') m = '不能停用自己';
          else if (m === 'CANNOT_DISABLE_LAST_ADMIN') m = '不能停用最后一名可用管理员';
          msg('操作失败：' + m, 'err');
        }
      }
      document.getElementById('uCreate').addEventListener('click', async function () {
        var username = document.getElementById('uName').value.trim();
        var display_name = document.getElementById('uDisp').value.trim();
        var password = document.getElementById('uPass').value;
        var role = document.getElementById('uRole').value;
        if (!username || !password) { msg('用户名与密码必填', 'err'); return; }
        try {
          await api('/api/users', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, display_name: display_name, password: password, role: role })
          });
          msg('已创建', 'ok');
          document.getElementById('uName').value = '';
          document.getElementById('uDisp').value = '';
          document.getElementById('uPass').value = '';
          loadUsers();
        } catch (e) { msg('创建失败：' + e.message, 'err'); }
      });
      document.getElementById('usersBody').addEventListener('click', async function (e) {
        var disable = e.target.dataset.disable, enable = e.target.dataset.enable, del = e.target.dataset.del;
        if (disable) return setUserStatus(disable, 'disabled', '停用后该用户将无法登录，确定停用？');
        if (enable) return setUserStatus(enable, 'active', '确定启用该账号？');
        if (!del) return;
        if (!confirm('删除用户将同时删除其全部文章与文件，确定删除？')) return;
        try { await api('/api/users/' + del, { method: 'DELETE' }); msg('已删除', 'ok'); loadUsers(); }
        catch (err) { msg('删除失败：' + err.message, 'err'); }
      });

      // ---- 账号设置（所有用户）：修改密码 ----
      document.getElementById('cpBtn').addEventListener('click', async function () {
        var oldPwd = document.getElementById('cpOld').value;
        var newPwd = document.getElementById('cpNew').value;
        var newPwd2 = document.getElementById('cpNew2').value;
        if (!oldPwd || !newPwd) { msg('请填写完整', 'err'); return; }
        if (newPwd.length < 8) { msg('新密码至少 8 位', 'err'); return; }
        if (newPwd !== newPwd2) { msg('两次输入的新密码不一致', 'err'); return; }
        var btn = this;
        btn.disabled = true;
        try {
          await api('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
          });
          alert('密码已修改，请重新登录');
          location.href = url('/login');
        } catch (err) {
          var m = err.message;
          if (m === 'WRONG_OLD_PASSWORD') m = '当前密码不正确';
          else if (m === 'TOO_MANY_REQUESTS') m = '尝试过于频繁，请稍后再试';
          msg('修改失败：' + m, 'err');
          btn.disabled = false;
        }
      });

      // ---- Tab 初始化（支持 ?tab= 直达） ----
      (async function init() {
        me = await HUB.requireMe();
        if (!me) return;
        myId = me.id;
        HUB.renderNav(me);
        if (me.role === 'admin') {
          document.getElementById('tabUsers').classList.remove('hidden');
          loadUsers();
        }
        loadPosts();
        loadFiles();
        var want = qs('tab');
        if (want) {
          var tab = document.querySelector('.console-tab[data-tab="' + want + '"]');
          if (tab && !tab.classList.contains('hidden')) tab.click();
        }
      })();
    })();
  </script>
</body>
</html>
