# Personal Hub - Nginx 反向代理配置
# 用法（Ubuntu）：
#   sudo cp deploy/nginx-web-service.conf /etc/nginx/sites-available/personal-hub
#   sudo ln -s /etc/nginx/sites-available/personal-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # 改成你的域名；仅用 IP 则写服务器公网 IP
    server_name your-domain.com;

    # 与 .env 中 MAX_FILE_SIZE 对齐（默认 50MB）
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- 启用 HTTPS（推荐，公网部署必选）----
# 1) 先确保上面 80 端口配置已生效且域名解析到本机
# 2) sudo apt install certbot python3-certbot-nginx
# 3) sudo certbot --nginx -d your-domain.com
# 成功后 Certbot 会自动改写本文件加入 443 与重定向；
# 之后把 .env 的 SESSION_SECURE 改为 true 并重启服务。
